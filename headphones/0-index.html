<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headphones - Header Hero</title>
  <link rel="stylesheet" href="0-styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="images/logo.svg" alt="Headphones Logo">
      </a>
      <nav class="main-nav">
        <ul>
          <li><a href="#what-we-do">What we do</a></li>
          <li><a href="#results">Our results</a></li>
          <li><a href="#contact">Contact us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <picture>
      <source media="(min-width:1024px)" srcset="images/01_headphones_desktop@2x.jpg">
      <source media="(min-width:480px)" srcset="images/01_headphones_tablet@2x.jpg">
      <img src="images/01_headphones_mobile@2x.jpg" alt="Person enjoying music with headphones">
    </picture>
    <div class="hero-text">
      <h1>Experience Music Like Never Before</h1>
      <p>High-quality headphones for audiophiles and casual listeners alike.</p>
      <a href="#cta" class="btn primary">Shop Now</a>
    </div>
  </section>
</body>
</html>
